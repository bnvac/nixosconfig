[package]
name = "nix2"
version = "0.1.0"
edition = "2021"
description = "nix²'s own tools in one small binary: menu, system check, rollback, game mode, printer alerts"
license = "MIT"

[dependencies]
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"
