[project]
name = "devlink"
version = "0.1.0"
description = "Link two machines over Syncthing and send anything between them"
requires-python = ">=3.11"
dependencies = []          # stdlib only

[project.scripts]
devlink = "devlink.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["devlink"]
