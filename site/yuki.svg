<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" role="img" aria-labelledby="yuki-title">
  <title id="yuki-title">Yuki, the nix² mascot: a girl with silver-blue hair, a snowflake hair clip and a blue nix² hoodie</title>
  <defs>
    <linearGradient id="yk-iris" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#25407f"/>
      <stop offset=".55" stop-color="#4a72c4"/>
      <stop offset="1" stop-color="#9cc8f0"/>
    </linearGradient>
    <linearGradient id="yk-hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e4ecfa"/>
      <stop offset="1" stop-color="#b9cbed"/>
    </linearGradient>
    <linearGradient id="yk-hair-back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b3c6ea"/>
      <stop offset="1" stop-color="#8ea8da"/>
    </linearGradient>
  </defs>
  <g stroke="#2f3b5c" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <!-- back hair -->
    <path fill="url(#yk-hair-back)" d="M200 58C116 58 76 126 80 206C83 262 74 318 58 372L84 356L80 404L112 372L120 410L146 372L150 336L250 336L254 372L280 410L288 372L320 404L316 356L342 372C326 318 317 262 320 206C324 126 284 58 200 58Z"/>
    <!-- hoodie -->
    <path fill="#3f5ea8" d="M138 318C150 304 174 300 200 300C226 300 250 304 262 318C300 334 330 368 338 480L62 480C70 368 100 334 138 318Z"/>
    <path fill="#34508f" d="M146 320C160 352 182 366 200 366C218 366 240 352 254 320C240 312 222 308 200 308C178 308 160 312 146 320Z"/>
    <!-- neck -->
    <path fill="#f9dccd" d="M182 270L218 270L220 318C212 330 188 330 180 318Z"/>
    <path fill="none" stroke-width="2.5" d="M170 340L166 410M230 340L234 410"/>
    <circle cx="166" cy="414" r="5" fill="#e9eef8"/>
    <circle cx="234" cy="414" r="5" fill="#e9eef8"/>
    <!-- face -->
    <path fill="#fde8dc" d="M126 176C124 236 146 268 170 284C184 293 192 297 200 297C208 297 216 293 230 284C254 268 276 236 274 176Z"/>
    <!-- shade under the bangs -->
    <path fill="#f6d3c4" stroke="none" d="M128 178L272 178L270 200C246 190 220 186 200 190C178 186 152 190 130 200Z"/>
    <!-- eyebrows -->
    <path fill="none" stroke-width="2.5" d="M148 186Q164 180 180 186M220 186Q236 180 252 186"/>
    <!-- eyes (blink together) -->
    <g class="yuki-eyes">
      <ellipse cx="164" cy="222" rx="18" ry="23" fill="url(#yk-iris)" stroke-width="2.5"/>
      <ellipse cx="236" cy="222" rx="18" ry="23" fill="url(#yk-iris)" stroke-width="2.5"/>
      <ellipse cx="164" cy="226" rx="8" ry="11" fill="#17234a" stroke="none"/>
      <ellipse cx="236" cy="226" rx="8" ry="11" fill="#17234a" stroke="none"/>
      <circle cx="171" cy="212" r="6" fill="#fff" stroke="none"/>
      <circle cx="243" cy="212" r="6" fill="#fff" stroke="none"/>
      <circle cx="157" cy="234" r="2.6" fill="#fff" stroke="none"/>
      <circle cx="229" cy="234" r="2.6" fill="#fff" stroke="none"/>
      <!-- upper lashes -->
      <path fill="#2f3b5c" stroke-width="2" d="M142 208C150 194 176 192 188 204L190 199C178 186 148 188 138 204Z"/>
      <path fill="#2f3b5c" stroke-width="2" d="M258 208C250 194 224 192 212 204L210 199C222 186 252 188 262 204Z"/>
      <path fill="none" stroke-width="2" d="M154 247Q164 250 174 247M226 247Q236 250 246 247"/>
    </g>
    <!-- blush -->
    <ellipse cx="146" cy="252" rx="13" ry="6" fill="#f4a2a8" fill-opacity=".55" stroke="none"/>
    <ellipse cx="254" cy="252" rx="13" ry="6" fill="#f4a2a8" fill-opacity=".55" stroke="none"/>
    <path fill="none" stroke="#e7838c" stroke-width="1.8" d="M140 254L144 249M146 255L150 250M152 255L156 250M244 254L248 249M250 255L254 250M256 255L260 250"/>
    <!-- nose and mouth -->
    <path fill="none" stroke-width="2" d="M199 244L201 248"/>
    <path fill="#c75a6c" stroke-width="2.5" d="M189 260Q200 275 211 260Q200 264 189 260Z"/>
    <!-- side locks -->
    <path fill="url(#yk-hair)" d="M128 150C112 200 114 262 128 316C134 296 138 262 140 236C142 214 140 186 146 160Z"/>
    <path fill="url(#yk-hair)" d="M272 150C288 200 286 262 272 316C266 296 262 262 260 236C258 214 260 186 254 160Z"/>
    <!-- top of the head and bangs -->
    <path fill="url(#yk-hair)" d="M118 206C110 118 152 64 200 64C248 64 290 118 282 206Q278 182 268 166Q266 188 258 200Q252 168 240 150Q240 176 232 190Q226 160 214 144Q214 168 208 184Q202 158 192 142Q190 168 184 186Q178 162 166 150Q164 178 158 196Q152 170 146 160Q144 184 136 198Q130 186 118 206Z"/>
    <!-- a few strands of shine -->
    <path fill="none" stroke="#ffffff" stroke-opacity=".8" stroke-width="3" d="M160 92Q182 82 204 84M226 88Q240 92 250 100"/>
    <!-- ahoge -->
    <path fill="url(#yk-hair)" d="M198 66C196 40 214 22 236 26C222 32 212 44 210 66Z"/>
    <!-- snowflake hair clip -->
    <g transform="translate(266 132)" stroke="#2f3b5c" stroke-width="2.4">
      <circle r="17" fill="#ffffff"/>
      <g stroke="#4a72c4" stroke-width="2.6" fill="none">
        <path d="M0-11V11M-9.5-5.5L9.5 5.5M-9.5 5.5L9.5-5.5"/>
        <path d="M-3-8L0-5L3-8M-3 8L0 5L3 8M-8.5-1.5L-5-2.5L-5.5-6M8.5 1.5L5 2.5L5.5 6M-8.5 1.5L-5 2.5L-5.5 6M8.5-1.5L5-2.5L5.5-6"/>
      </g>
    </g>
    <!-- hoodie print -->
    <text x="268" y="426" fill="#e9eef8" stroke="none" font-family="Sora, Inter, system-ui, sans-serif" font-size="26" font-weight="700" text-anchor="middle">nix²</text>
  </g>
</svg>
