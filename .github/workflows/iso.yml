# Builds the installer USB image for every release (and on demand from the
# Actions tab), and attaches it to the release as hearth-installer.iso.
name: installer image
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  iso:
    runs-on: ubuntu-latest
    steps:
      - name: Make room (the build needs ~15 GB)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-26.05
      - name: Build the image
        run: |
          nix-build '<nixpkgs/nixos>' -A config.system.build.isoImage -I nixos-config=./installer/iso.nix
          cp result/iso/*.iso hearth-installer.iso
          sha256sum hearth-installer.iso > hearth-installer.iso.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: hearth-installer
          path: hearth-installer.iso*
      - name: Attach to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            hearth-installer.iso
            hearth-installer.iso.sha256
