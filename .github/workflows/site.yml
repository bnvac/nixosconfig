# Publishes site/ (the nix² homepage) to GitHub Pages on every push that
# changes it. One-time setup: Settings → Pages → Source: "GitHub Actions".
name: site
on:
  push:
    paths: [ "site/**", ".github/workflows/site.yml" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Until Pages is turned on (Settings → Pages → Source: GitHub Actions)
      # there's nowhere to deploy: say so and skip, instead of failing.
      - name: Is GitHub Pages on?
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages is off, so the site wasn't published. Turn it on: Settings → Pages → Source: GitHub Actions, then re-run this workflow."
          fi
      - name: Build the page
        # site/index.html is the page's body (it also previews as a claude.ai
        # artifact); wrap it in a full HTML document.
        run: |
          mkdir -p _site
          {
            printf '<!doctype html>\n<html lang="en">\n<head>\n<meta charset="utf-8">\n'
            printf '<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">\n'
            printf '<style>body{margin:0}img{max-width:100%%}[hidden]{display:none!important}</style>\n</head>\n<body>\n'
            cat site/index.html
            printf '\n</body>\n</html>\n'
          } > _site/index.html
      - uses: actions/configure-pages@v5
        if: steps.pages.outputs.enabled == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outputs.enabled == 'true'
        with:
          path: _site
      - id: deploy
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/deploy-pages@v4
